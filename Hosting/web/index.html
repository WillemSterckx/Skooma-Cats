<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citi Bike: electric bike or not?</title>
<style>
  :root{
    --orange:#ff7a00;
    --purple:#4c0f8a;
    --purple-soft:#6a1bb0;
    --ink:#3d0a6b;
    --halo:#ffffff;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    padding:44px 16px 110px;
    min-height:100vh;
    color:var(--purple);
    font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive,system-ui,sans-serif;
    background-color:var(--orange);
    background-image:
      radial-gradient(circle at 12% 12%, #ffc04d 0%, rgba(255,192,77,0) 42%),
      radial-gradient(circle at 88% 6%,  #ffa640 0%, rgba(255,166,64,0) 40%),
      radial-gradient(circle at 50% 112%,#ff9d2e 0%, rgba(255,157,46,0) 58%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 22px, rgba(255,255,255,0) 22px 44px);
    overflow-x:hidden;
  }

  .pop{
    text-shadow:
      2px 2px 0 var(--halo),
      -2px -2px 0 var(--halo),
      2px -2px 0 var(--halo),
      -2px 2px 0 var(--halo),
      0 0 12px rgba(255,255,255,.85),
      4px 5px 0 rgba(76,15,138,.35),
      0 14px 22px rgba(90,25,0,.45);
  }
  .pop-soft{
    text-shadow:
      1px 1px 0 var(--halo),
      -1px -1px 0 var(--halo),
      1px -1px 0 var(--halo),
      -1px 1px 0 var(--halo),
      2px 3px 0 rgba(76,15,138,.28);
  }

  main{
    position:relative;
    z-index:1;
    max-width:480px;
    margin:0 auto;
    padding:26px 24px 30px;
    border-radius:28px;
    border:6px dashed #ff2fb9;
    background-image:linear-gradient(135deg,
      #fff6d5 0%, #ffe3f4 25%, #e3f0ff 50%, #e6ffe8 75%, #fff6d5 100%);
    box-shadow:
      0 0 0 8px  #ffd93d,
      0 0 0 16px #38d17a,
      0 0 0 24px #43c6ff,
      0 26px 0 -6px rgba(120,40,0,.25),
      0 36px 55px rgba(90,30,0,.45);
    transform-origin:center center;
    will-change:transform;
    animation:dance 8s ease-in-out infinite;
  }

  @keyframes dance{
    0%   { transform:translate(0,0)        rotate(-1.2deg)  scale(1);     }
    8%   { transform:translate(-8px,-10px) rotate(1.6deg)   scale(1.012); }
    16%  { transform:translate(6px,-16px)  rotate(-2deg)    scale(1.022); }
    24%  { transform:translate(12px,-6px)  rotate(2.4deg)   scale(1.005); }
    32%  { transform:translate(4px,6px)    rotate(-1.4deg)  scale(.988);  }
    40%  { transform:translate(-10px,-12px) rotate(1.8deg)  scale(1.018); }
    48%  { transform:translate(-14px,-2px) rotate(-2.2deg)  scale(1.024); }
    56%  { transform:translate(-2px,-14px) rotate(1.4deg)   scale(1.008); }
    64%  { transform:translate(10px,-8px)  rotate(-1.8deg)  scale(1.016); }
    72%  { transform:translate(14px,4px)   rotate(2deg)     scale(.992);  }
    80%  { transform:translate(6px,-10px)  rotate(-1deg)    scale(1.01);  }
    88%  { transform:translate(-6px,-4px)  rotate(1.2deg)   scale(1.004); }
    100% { transform:translate(0,0)        rotate(-1.2deg)  scale(1);     }
  }

  main:hover{ animation-duration:2.6s; }
  main:focus-within{ animation-duration:4.5s; }

  h1{
    font-size:1.55rem;
    line-height:1.25;
    margin:0 0 8px;
    text-align:center;
    color:var(--purple);
    letter-spacing:.5px;
  }

  p.sub{
    margin:0 0 18px;
    text-align:center;
    color:var(--purple-soft);
    font-size:.95rem;
    line-height:1.35;
  }

  label{
    display:block;
    font-size:.95rem;
    margin:16px 0 6px;
    font-weight:700;
    color:var(--purple);
  }

  input, select{
    width:100%;
    padding:11px 13px;
    font-family:inherit;
    font-size:1rem;
    color:var(--ink);
    background:#ffffff;
    border:3px dashed #b06bff;
    border-radius:14px;
    box-shadow:0 3px 0 rgba(120,60,180,.22), inset 0 2px 6px rgba(120,60,180,.12);
  }
  input::placeholder{ color:#a482d6; }

  input:focus, select:focus{
    outline:3px solid #ffd93d;
    outline-offset:2px;
    border-style:solid;
    animation:wiggle .45s ease-in-out;
  }
  @keyframes wiggle{
    0%,100%{ transform:rotate(0deg); }
    25%    { transform:rotate(-1.4deg); }
    75%    { transform:rotate(1.4deg); }
  }

  .muted{
    color:#8a4b00;
    font-size:.85rem;
    margin:8px 0 0;
    font-weight:700;
  }

  button{
    width:100%;
    margin-top:24px;
    padding:14px 16px;
    font-family:inherit;
    font-size:1.15rem;
    font-weight:700;
    color:#ffffff;
    text-shadow:2px 2px 0 rgba(60,0,110,.55);
    background-image:linear-gradient(180deg,#b45cff,#7a17c9 60%,#5f0fa3);
    border:4px solid #ffd93d;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 7px 0 #3f0a70, 0 12px 20px rgba(80,20,0,.4);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
  }
  button:hover:not(:disabled){ filter:brightness(1.12); animation:wiggle .5s ease-in-out; }
  button:active:not(:disabled){
    transform:translateY(5px);
    box-shadow:0 2px 0 #3f0a70, 0 6px 12px rgba(80,20,0,.4);
  }
  button:disabled{ opacity:.65; cursor:wait; filter:grayscale(.35); }

  #result{ margin-top:24px; display:none; }

  .answer{
    font-size:1.3rem;
    font-weight:700;
    text-align:center;
    color:var(--purple);
    margin-bottom:4px;
  }

  .bar{
    height:18px;
    background:#ffe6b8;
    border:3px dashed #b06bff;
    border-radius:99px;
    overflow:hidden;
    margin:14px 0 8px;
  }
  .bar > div{
    height:100%;
    width:0;
    border-radius:99px;
    background-image:linear-gradient(90deg,#ff2fb9,#ffd93d,#38d17a,#43c6ff,#b45cff,#ff2fb9);
    background-size:200% 100%;
    animation:slide 2.2s linear infinite;
    transition:width .4s ease;
  }
  @keyframes slide{ to{ background-position:200% 0; } }

  #detail{ text-align:center; }

  .error{
    margin:18px 0 0;
    text-align:center;
    font-weight:700;
    color:#b3001f;
    text-shadow:
      1px 1px 0 var(--halo), -1px -1px 0 var(--halo),
      1px -1px 0 var(--halo), -1px 1px 0 var(--halo),
      2px 3px 0 rgba(0,0,0,.25);
  }

  .deco{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .deco > *{
    position:absolute;
    animation:bob 3.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-8deg); }
    50%    { transform:translateY(-16px) rotate(8deg); }
  }

  .bubble{
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,.1) 60%, rgba(255,255,255,0));
    border:2px solid rgba(255,255,255,.6);
    box-shadow:inset -2px -2px 6px rgba(0,0,0,.1);
  }
  .star{
    background:#ffd93d;
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .smiley{
    border-radius:50%;
    background:#ffe066;
    border:4px solid #b06bff;
    box-shadow:0 8px 0 rgba(0,0,0,.2);
  }
  .smiley::before,
  .smiley::after{
    content:'';
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#3d0a6b;
    top:24px;
  }
  .smiley::before{ left:20px; }
  .smiley::after{ right:20px; }
  .smiley .mouth{
    position:absolute;
    width:40px;
    height:20px;
    border-bottom:4px solid #3d0a6b;
    border-radius:0 0 40px 40px;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
  }
  .frog{
    border-radius:50%;
    background:#6fbf3f;
    border:4px solid #3d0a6b;
  }
  .frog::before,
  .frog::after{
    content:'';
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    background:white;
    border:3px solid #3d0a6b;
    top:10px;
  }
  .frog::before{ left:8px; }
  .frog::after{ right:8px; }
  .frog .pupil{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#3d0a6b;
    top:18px;
  }
  .frog .pupil.left{ left:14px; }
  .frog .pupil.right{ right:14px; }
  .frog .mouth{
    position:absolute;
    width:30px;
    height:10px;
    border-bottom:3px solid #3d0a6b;
    border-radius:0 0 30px 30px;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
  }

  @media (max-width:760px){
    .deco > *{ opacity:.35; transform:scale(.6); }
  }

  @media (prefers-reduced-motion: reduce){
    main, main:hover, main:focus-within{ animation:none; transform:none; }
    .deco > *, .bar > div, input:focus, select:focus, button:hover{ animation:none; }
  }
</style>
</head>
<body>

<!-- Hidden coconut image. If this file is missing, the page breaks. -->
<img
  src="coconut.jpg"
  alt=""
  style="display:none"
  onerror="window.coconutMissing=true; document.body.innerHTML='<div style=&quot;font-family:sans-serif;padding:40px;text-align:center;color:#b3001f;font-size:1.2rem;font-weight:700;&quot;>The coconut image is missing. The page cannot work.</div>';"
>

<!-- silly CSS decorations, no emojis -->
<div class="deco" aria-hidden="true">
  <div class="frog" style="top:2%;left:4%;width:70px;height:70px;animation-delay:-1.1s;">
    <div class="pupil left"></div>
    <div class="pupil right"></div>
    <div class="mouth"></div>
  </div>
  <div class="smiley" style="bottom:6%;left:5%;width:80px;height:80px;animation-delay:-1.9s;">
    <div class="mouth"></div>
  </div>
  <div class="bubble" style="top:24%;left:3%;width:42px;height:42px;animation-delay:-2.6s;"></div>
  <div class="bubble" style="top:60%;right:3%;width:52px;height:52px;animation-delay:-.7s;"></div>
  <div class="bubble" style="bottom:28%;right:2%;width:40px;height:40px;animation-delay:-3.3s;"></div>
  <div class="star" style="top:1%;left:26%;width:30px;height:30px;animation-delay:-.4s;"></div>
  <div class="star" style="top:7%;left:37%;width:26px;height:26px;animation-delay:-1.6s;"></div>
  <div class="star" style="top:2%;left:51%;width:34px;height:34px;animation-delay:-2.2s;"></div>
  <div class="star" style="top:9%;left:67%;width:28px;height:28px;animation-delay:-.9s;"></div>
  <div class="star" style="top:46%;left:1%;width:36px;height:36px;animation-delay:-1.4s;"></div>
  <div class="star" style="top:72%;left:5%;width:36px;height:36px;animation-delay:-2.1s;"></div>
</div>

<main>
  <h1 class="pop">Electric bike or not?</h1>
  <p class="sub pop-soft">Guesses whether a finished Citi Bike ride that started at a dock used an electric bike.</p>

  <form id="f">
    <label for="station">Start station</label>
    <input id="station" list="stations" placeholder="Loading stations..." autocomplete="off" required disabled>
    <datalist id="stations"></datalist>

    <label for="rider">Rider type</label>
    <select id="rider">
      <option value="member">Member</option>
      <option value="casual">Casual</option>
    </select>

    <label for="when">Start time (New York time)</label>
    <input id="when" type="datetime-local" required>

    <label for="until">End time (New York time)</label>
    <input id="until" type="datetime-local" required>
    <p class="muted">The ride must last between 1 minute and 24 hours.</p>

    <button id="go" type="submit" disabled>Predict!</button>
  </form>

  <div id="result" aria-live="polite">
    <div class="answer pop-soft" id="answer"></div>
    <div class="bar"><div id="fill"></div></div>
    <div class="muted" id="detail"></div>
  </div>
  <p class="error" id="error"></p>
</main>

<script>
  // === The only thing you need to edit: your ngrok domain (no trailing slash) ===
  const API_BASE = "https://swoosh-dropper-defuse.ngrok-free.dev";
  // ==============================================================================

  // If the coconut image is missing, stop everything.
  if (window.coconutMissing || !document.getElementById("f")) {
    throw new Error("Coconut image missing. Page disabled.");
  }

  const HEADERS = { "ngrok-skip-browser-warning": "1" };
  const $ = (id) => document.getElementById(id);
  const labelToId = new Map();

  const localIso = (ms) => new Date(ms - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  $("until").value = localIso(Date.now());
  $("when").value = localIso(Date.now() - 15 * 60000);

  function showError(msg) { $("error").textContent = msg; $("result").style.display = "none"; }

  async function loadStations() {
    try {
      const r = await fetch(API_BASE + "/stations", { headers: HEADERS });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const stations = await r.json();
      const counts = {};
      stations.forEach((s) => { counts[s.name] = (counts[s.name] || 0) + 1; });
      for (const s of stations) {
        const label = counts[s.name] > 1 ? `${s.name} [${s.id}]` : s.name;
        labelToId.set(label, s.id);
        const o = document.createElement("option");
        o.value = label;
        $("stations").appendChild(o);
      }
      $("station").disabled = false;
      $("station").placeholder = "Start typing a station name...";
      $("go").disabled = false;
    } catch (e) {
      showError("Could not reach the API. Is the server running? (" + e.message + ")");
    }
  }

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("error").textContent = "";
    const id = labelToId.get($("station").value);
    if (!id) { showError("Pick a station from the list."); return; }

    const minutes = (new Date($("until").value) - new Date($("when").value)) / 60000;
    if (!(minutes >= 1 && minutes <= 1440)) { showError("End time must be 1 minute to 24 hours after the start time."); return; }

    const body = new URLSearchParams({
      start_station_id: id,
      member_casual: $("rider").value,
      started_at: $("when").value,
      ended_at: $("until").value,
    }).toString();

    $("go").disabled = true;
    try {
      const r = await fetch(API_BASE + "/predict", {
        method: "POST",
        headers: { ...HEADERS, "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || JSON.stringify(data.detail || data));
      const pct = Math.round(data.probability_electric * 100);
      $("answer").textContent = data.prediction === "electric_bike"
        ? "Likely an electric bike"
        : "Likely a classic bike";
      $("fill").style.width = pct + "%";
      $("detail").textContent = `${pct}% chance of an electric bike (model ${data.model_version})`;
      $("result").style.display = "block";
    } catch (err) {
      showError("Prediction failed: " + err.message);
    } finally {
      $("go").disabled = false;
    }
  });

  loadStations();
</script>
</body>
</html>

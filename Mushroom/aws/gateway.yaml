AWSTemplateFormatVersion: '2010-09-09'
Description: Skooma-Cats mushroom model - public HTTPS url with an api key in front of the SageMaker endpoint

Parameters:
  EndpointName:
    Type: String
    Default: skooma-mushroom
  LambdaRoleArn:
    Type: String
    Description: role the lambda runs as (in AWS Academy this is the LabRole)
  CodeBucket:
    Type: String
  CodeKey:
    Type: String

Resources:
  PredictFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !Ref LambdaRoleArn
      Timeout: 28
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          ENDPOINT_NAME: !Ref EndpointName

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: skooma-mushroom-api
      EndpointConfiguration:
        Types: [REGIONAL]

  PredictResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: predict

  HealthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: health

  PredictMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref PredictResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PredictFunction.Arn}/invocations

  HealthMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref HealthResource
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PredictFunction.Arn}/invocations

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PredictFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [PredictMethod, HealthMethod]
    Properties:
      RestApiId: !Ref Api

  ProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref Deployment
      StageName: prod

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: skooma-mushroom-key
      Enabled: true

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ProdStage
    Properties:
      UsagePlanName: skooma-mushroom-plan
      ApiStages:
        - ApiId: !Ref Api
          Stage: prod
      # keeps a leaked key from burning the budget
      Throttle:
        RateLimit: 5
        BurstLimit: 10
      Quota:
        Limit: 5000
        Period: DAY

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

Outputs:
  PredictUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/predict
  HealthUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/health
  ApiKeyId:
    Value: !Ref ApiKey
  ApiId:
    Value: !Ref Api
